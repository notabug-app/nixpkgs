name: Update Flake
on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Run Update Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop -c update-flake
      - name: Read PR Message
        id: pr_msg
        run: |
          if [ -f .pr-message ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            cat .pr-message >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "body=chore: update flake and packages" >> $GITHUB_OUTPUT
          fi
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.pr_msg.outputs.body }}
          title: "chore: update flake and packages"
          body: ${{ steps.pr_msg.outputs.body }}
          branch: "chore/update-flake"
          delete-branch: true
          sign-commits: true
