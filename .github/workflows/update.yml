name: Update Flake Lock

on:
  schedule:
    - cron: "0 0 * * 0" # Run once a week at midnight on Sunday
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-public-keys = ${{ secrets.FIRN_PKEY }} crane.cachix.org-1:8Scfpmn9w+hGdXH/Q9tTLiYAE/2dnJYRJP7kl80GuRk=

      - name: Authenticate to Firn Cache (nix.conf)
        run: |
          HOST=$(echo "${{ secrets.FIRN_URL }}" | awk -F/ '{print $3}')
          echo "access-tokens = $HOST=${{ secrets.FIRN_SECRET }}" | sudo tee -a /etc/nix/nix.conf > /dev/null

      - name: Update Vaultwarden Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop -c update-vaultwarden

      - name: Update Flake Inputs
        run: nix flake update

      - name: Commit and Push Changes
        run: nix develop -c commit-update
