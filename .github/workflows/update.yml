name: Update Flake Lock

on:
  schedule:
    - cron: "0 0 * * 0" # Run once a week at midnight on Sunday
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Update vaultwarden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix develop -c update-vaultwarden

      - name: Update flake
        run: nix flake update

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock flake.nix pkgs.nix
          git commit -m "chore: update flake and vaultwarden" || echo "No changes to commit"
          git push
