name: Build Nix Packages
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Generate matrix
        id: set-matrix
        run: |
          x86=$(nix eval --json .#packages.x86_64-linux --apply 'builtins.attrNames')
          arm=$(nix eval --json .#packages.aarch64-linux --apply 'builtins.attrNames')
          matrix=$(jq -c -n --argjson x86 "$x86" --argjson arm "$arm" '
            {
              include: (
                ($x86 | map({os: "ubuntu-latest", arch: "x86_64-linux", package: .})) +
                ($arm | map({os: "ubuntu-24.04-arm", arch: "aarch64-linux", package: .}))
              )
            }
          ')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    needs: evaluate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.evaluate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$|\.tar\.xz$|\.patch$|\.drv$|-dev$)'
      - name: Build package
        run: nix build -L .#packages.${{ matrix.arch }}.${{ matrix.package }}
