name: Build and Cache Nix Packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            netrc-file = /etc/nix/netrc
            accept-flake-config = true
            extra-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-public-keys = ${{ secrets.FIRN_PKEY }} crane.cachix.org-1:8Scfpmn9w+hGdXH/Q9tTLiYAE/2dnJYRJP7kl80GuRk=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Authenticate to Firn Cache
        run: |
          nix run .#firn -- login --server-url ${{ secrets.FIRN_URL }} --token ${{ secrets.FIRN_SECRET }} --netrc /tmp/netrc
          sudo cp /tmp/netrc /etc/nix/netrc
      - name: Generate Package Matrix
        id: set-matrix
        run: nix develop -c generate-matrix

  build-aarch64-firn:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            netrc-file = /etc/nix/netrc
            accept-flake-config = true
            extra-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-public-keys = ${{ secrets.FIRN_PKEY }} crane.cachix.org-1:8Scfpmn9w+hGdXH/Q9tTLiYAE/2dnJYRJP7kl80GuRk=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Authenticate to Firn Cache
        run: |
          nix run .#firn -- login --server-url ${{ secrets.FIRN_URL }} --token ${{ secrets.FIRN_SECRET }} --netrc /tmp/netrc
          sudo cp /tmp/netrc /etc/nix/netrc

      - name: Build Firn (aarch64)
        run: nix build .#packages.aarch64-linux.firn -L

      - name: Push to Firn Cache
        if: always()
        run: nix run .#firn -- push --include-drv --include-error-logs ./result

  build:
    needs: [generate-matrix, build-aarch64-firn]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            netrc-file = /etc/nix/netrc
            accept-flake-config = true
            extra-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-public-keys = ${{ secrets.FIRN_PKEY }} crane.cachix.org-1:8Scfpmn9w+hGdXH/Q9tTLiYAE/2dnJYRJP7kl80GuRk=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Authenticate to Firn Cache
        run: |
          nix run .#firn -- login --server-url ${{ secrets.FIRN_URL }} --token ${{ secrets.FIRN_SECRET }} --netrc /tmp/netrc
          sudo cp /tmp/netrc /etc/nix/netrc



      - name: Build Nix Package
        run: nix build .#packages.aarch64-linux.${{ matrix.package }} -L

      - name: Push to Firn Cache
        if: always()
        run: nix run .#firn -- push --include-drv --include-error-logs ./result

  build-x86_64-firn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            netrc-file = /etc/nix/netrc
            accept-flake-config = true
            extra-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-substituters = ${{ secrets.FIRN_URL }} https://crane.cachix.org
            extra-trusted-public-keys = ${{ secrets.FIRN_PKEY }} crane.cachix.org-1:8Scfpmn9w+hGdXH/Q9tTLiYAE/2dnJYRJP7kl80GuRk=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Authenticate to Firn Cache
        run: |
          nix run .#firn -- login --server-url ${{ secrets.FIRN_URL }} --token ${{ secrets.FIRN_SECRET }} --netrc /tmp/netrc
          sudo cp /tmp/netrc /etc/nix/netrc

      - name: Build Firn (x86_64)
        run: nix build .#packages.x86_64-linux.firn -L

      - name: Push to Firn Cache
        if: always()
        run: nix run .#firn -- push --include-drv --include-error-logs ./result
