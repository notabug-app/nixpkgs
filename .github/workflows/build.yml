name: Build Nix Packages
on:
  push:
    branches:
      - staging
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'versions.json'
      - '.github/workflows/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}
      - name: Generate matrix
        id: set-matrix
        run: |
          x86=$(nix eval --accept-flake-config --json .#packages.x86_64-linux --apply 'builtins.attrNames')
          arm=$(nix eval --accept-flake-config --json .#packages.aarch64-linux --apply 'pkgs: builtins.filter (n: !(builtins.match "^(kernel|cpupower)-.*" n != null)) (builtins.attrNames pkgs)')
          matrix=$(jq -c -n --argjson x86 "$x86" --argjson arm "$arm" '
            {
              include: [
                { os: "ubuntu-latest", arch: "x86_64-linux", packages: $x86 },
                { os: "ubuntu-24.04-arm", arch: "aarch64-linux", packages: $arm }
              ]
            }
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: evaluate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.evaluate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
          use-gha-cache: true
          diff-store: false
      - name: Build and push packages
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          PACKAGES_JSON: ${{ toJson(matrix.packages) }}
        run: |
          for pkg in $(echo "$PACKAGES_JSON" | jq -r '.[]'); do
            echo "::group::Evaluating $pkg (${{ matrix.arch }})"
            outputs=$(nix eval --accept-flake-config --raw ".#packages.${{ matrix.arch }}.$pkg" --apply 'p: builtins.concatStringsSep "," (builtins.filter (o: !(builtins.elem o ["dev" "doc" "man" "info" "debug" "installedTests"])) (p.outputs or ["out"]))')
            paths=$(nix eval --accept-flake-config --json ".#packages.${{ matrix.arch }}.$pkg" --apply 'p: map (o: p.${o}.outPath or "") (builtins.filter (o: !(builtins.elem o ["dev" "doc" "man" "info" "debug" "installedTests"])) (p.outputs or ["out"]))' | jq -r '.[]')

            cached=true
            if [ -z "$paths" ]; then
              cached=false
            else
              for p in $paths; do
                h=$(basename "$p" | cut -d'-' -f1)
                if [ -n "$h" ]; then
                  status=$(curl -s -o /dev/null -w "%{http_code}" -I "https://notabug.cachix.org/${h}.narinfo")
                  if [ "$status" != "200" ]; then
                    cached=false
                    break
                  fi
                fi
              done
            fi

            if [ "$cached" = "true" ]; then
              echo "Package $pkg is already cached in Cachix, skipping build."
              echo "::endgroup::"
              continue
            fi

            echo "Package $pkg uncached in Cachix. Starting build..."
            has_artifacts=$(nix eval --accept-flake-config --raw ".#packages.${{ matrix.arch }}.$pkg" --apply 'p: if (p.cargoArtifacts or (p.passthru.cargoArtifacts or null)) != null then "yes" else "no"' 2>/dev/null || echo "no")
            artifact_path=""
            if [ "$has_artifacts" = "yes" ]; then
              echo "Pre-building cargoArtifacts for $pkg..."
              artifact_path=$(nix eval --accept-flake-config --raw ".#packages.${{ matrix.arch }}.$pkg" --apply 'p: (p.cargoArtifacts or p.passthru.cargoArtifacts).outPath' 2>/dev/null || echo "")
              nix build --accept-flake-config --no-link -L ".#packages.${{ matrix.arch }}.$pkg.cargoArtifacts"
            fi

            echo "Building $pkg outputs ($outputs)..."
            rm -f built.json
            nix build --accept-flake-config --no-link -L --json ".#packages.${{ matrix.arch }}.$pkg^$outputs" > built.json
            jq empty built.json

            built_paths=$(jq -r '.[].outputs | to_entries[] | select(.key | test("^(dev|doc|man|info|debug|installedTests)$") | not) | .value' built.json)
            if [ -z "$built_paths" ]; then
              echo "::error::No deployment outputs found in built.json for $pkg"
              exit 1
            fi

            if [ -n "$artifact_path" ]; then
              built_paths=$(printf "%s\n%s" "$built_paths" "$artifact_path")
            fi

            echo "Store paths to push for $pkg:"
            echo "$built_paths"
            for i in {1..3}; do
              if echo "$built_paths" | cachix push notabug; then
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "::error::Failed to push $pkg to Cachix after 3 attempts"
                exit 1
              fi
              echo "Cachix push failed, retrying in 10s (attempt $i/3)..."
              sleep 10
            done
            echo "::endgroup::"
          done
  kernel:
    uses: ./.github/workflows/kernel.yml
    secrets: inherit
  promote:
    needs:
      - build
      - kernel
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      (needs.kernel.result == 'success' || needs.kernel.result == 'skipped') &&
      github.ref == 'refs/heads/staging'
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fast-forward main to staging
        run: |
          git push origin ${{ github.sha }}:refs/heads/main
