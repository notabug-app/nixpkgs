name: Build and Cache Nix Packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://crane.cachix.org
            extra-trusted-substituters = https://crane.cachix.org
            extra-trusted-public-keys = crane.cachix.org-1:8Scfpmn9w+hGdXH/Q9tTLiYAE/2dnJYRJP7kl80GuRk=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Generate Package Matrix
        id: set-matrix
        run: nix develop -c generate-matrix

  build-aarch64-firn:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://crane.cachix.org
            extra-trusted-substituters = https://crane.cachix.org
            extra-trusted-public-keys = crane.cachix.org-1:8Scfpmn9w+hGdXH/Q9tTLiYAE/2dnJYRJP7kl80GuRk=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Firn (aarch64)
        run: nix build .#packages.aarch64-linux.firn -L

  build:
    needs: [generate-matrix, build-aarch64-firn]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://crane.cachix.org
            extra-trusted-substituters = https://crane.cachix.org
            extra-trusted-public-keys = crane.cachix.org-1:8Scfpmn9w+hGdXH/Q9tTLiYAE/2dnJYRJP7kl80GuRk=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'



      - name: Build Nix Package
        run: nix build .#packages.aarch64-linux.${{ matrix.package }} -L

  build-x86_64-firn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://crane.cachix.org
            extra-trusted-substituters = https://crane.cachix.org
            extra-trusted-public-keys = crane.cachix.org-1:8Scfpmn9w+hGdXH/Q9tTLiYAE/2dnJYRJP7kl80GuRk=

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Firn (x86_64)
        run: nix build .#packages.x86_64-linux.firn -L
