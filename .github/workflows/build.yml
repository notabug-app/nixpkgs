name: Build and Cache Nix Packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Generate Matrix
        id: set-matrix
        run: nix develop -c generate-matrix

  build:
    needs: generate-matrix
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main




      - name: Setup Attic cache
        env:
          ATTIC_URL: ${{ secrets.ATTIC_URL }}
          ATTIC_SECRET: ${{ secrets.ATTIC_SECRET }}
        run: nix develop -c setup-attic ${{ secrets.ATTIC_CACHE }}

      - name: Record store paths before build
        run: nix develop -c record-store-paths

      - name: Build package
        run: nix build .#packages.aarch64-linux.${{ matrix.package }} -L

      - name: Push to Attic cache (with retry)
        if: always()
        env:
          ATTIC_URL: ${{ secrets.ATTIC_URL }}
          ATTIC_SECRET: ${{ secrets.ATTIC_SECRET }}
        run: nix develop -c push-to-attic ${{ secrets.ATTIC_CACHE }}
