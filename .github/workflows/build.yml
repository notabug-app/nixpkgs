name: Build and Cache Nix Packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Generate Matrix
        id: set-matrix
        run: |
          PKGS=$(nix eval --json .#packages.aarch64-linux --apply 'builtins.attrNames')
          echo "matrix=$PKGS" >> "$GITHUB_OUTPUT"

  build:
    needs: generate-matrix
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install Attic
        run: nix profile install nixpkgs#attic-client

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ secrets.ATTIC_URL }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_SECRET }}
          skip-push: true

      - name: Record store paths before build
        run: nix path-info --all > /tmp/store-paths-before

      - name: Build package
        run: nix build .#packages.aarch64-linux.${{ matrix.package }} -L

      - name: Push to Attic cache (with retry)
        if: always()
        run: |
          nix path-info --all > /tmp/store-paths-after
          comm -13 <(sort /tmp/store-paths-before) <(sort /tmp/store-paths-after) > /tmp/store-paths-new
          grep -v '\.drv$' /tmp/store-paths-new > /tmp/store-paths-to-push || true
          
          if [ -s /tmp/store-paths-to-push ]; then
            echo "Pushing $(wc -l < /tmp/store-paths-to-push) paths..."
            for i in {1..5}; do
              if attic push --stdin ${{ secrets.ATTIC_CACHE }} < /tmp/store-paths-to-push; then
                echo "Push successful!"
                exit 0
              fi
              echo "Push failed, retrying in 5 seconds... ($i/5)"
              sleep 5
            done
            echo "Failed to push after 5 attempts."
            exit 1
          else
            echo "No new paths to push."
          fi
