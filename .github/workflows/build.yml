name: Build and Cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install Attic
        run: nix profile install nixpkgs#attic-client

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ secrets.ATTIC_URL }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_SECRET }}

      - name: Build kernel
        run: nix build .#legacyPackages.aarch64-linux.linuxPackages_rpi_7_1.kernel -L

  build-pkgs:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        package:
          - cf-ddns
          - dnsr
          - rpi-vcio
          - vaultwarden
          - vaultwarden-vault
          - cpupower
          - libraspberrypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install Attic
        run: nix profile install nixpkgs#attic-client

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ secrets.ATTIC_URL }}
          cache: ${{ secrets.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_SECRET }}

      - name: Build package
        run: nix build .#legacyPackages.aarch64-linux.${{ matrix.package }} -L
