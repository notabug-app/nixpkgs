name: Build Nix Packages
on:
  push:
    branches:
      - staging
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'versions.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}
      - name: Generate matrix
        id: set-matrix
        run: |
          x86=$(nix eval --accept-flake-config --json .#packages.x86_64-linux --apply 'builtins.attrNames')
          arm=$(nix eval --accept-flake-config --json .#packages.aarch64-linux --apply 'builtins.attrNames')
          matrix=$(jq -c -n --argjson x86 "$x86" --argjson arm "$arm" '
            {
              include: (
                ($x86 | map({os: "ubuntu-latest", arch: "x86_64-linux", package: .})) +
                ($arm | map({os: "ubuntu-24.04-arm", arch: "aarch64-linux", package: .}))
              )
            }
          ')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
  build:
    needs: evaluate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.evaluate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
      - name: Build package
        run: |
          nix build --accept-flake-config --no-link -L --json ".#packages.${{ matrix.arch }}.${{ matrix.package }}^*" > built.json
          jq empty built.json
      - name: Push deployment outputs to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          paths=$(jq -r '.[].outputs | to_entries[] | select(.key | test("^(dev|doc|man|info|debug|installedTests)$") | not) | .value' built.json)
          if [ -z "$paths" ]; then
            echo "::error::No deployment outputs found in built.json"
            exit 1
          fi
          echo "Store paths to push:"
          echo "$paths"
          for i in {1..3}; do
            if echo "$paths" | cachix push notabug; then
              exit 0
            fi
            if [ "$i" -eq 3 ]; then
              echo "::error::Failed to push to Cachix after 3 attempts"
              exit 1
            fi
            echo "Cachix push failed, retrying in 10s (attempt $i/3)..."
            sleep 10
          done
  promote:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fast-forward main to staging
        run: |
          git push origin ${{ github.sha }}:refs/heads/main
