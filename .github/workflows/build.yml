name: Build and Cache Nix Packages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  generate-matrix:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          firn-url: ${{ secrets.FIRN_URL }}
          firn-pkey: ${{ secrets.FIRN_PKEY }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Generate Package Matrix
        id: set-matrix
        run: nix develop -c generate-matrix

  build-cache-client:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
        include:
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: ubuntu-24.04
            system: x86_64-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Nix Environment
        uses: ./.github/actions/setup-nix
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          firn-url: ${{ secrets.FIRN_URL }}
          firn-pkey: ${{ secrets.FIRN_PKEY }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and Push Firn
        run: |
          nix build .#packages.${{ matrix.system }}.firn -L
          ./result/bin/firn auth login --server-url ${{ secrets.FIRN_URL }} --token ${{ secrets.FIRN_TOKEN }}
          ./result/bin/firn push --include-drv --include-error-logs --include-ls ./result

