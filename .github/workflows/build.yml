name: Build Nix Packages
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}
      - name: Generate matrix
        id: set-matrix
        run: |
          x86=$(nix eval --accept-flake-config --json .#packages.x86_64-linux --apply 'builtins.attrNames')
          arm=$(nix eval --accept-flake-config --json .#packages.aarch64-linux --apply 'builtins.attrNames')
          matrix=$(jq -c -n --argjson x86 "$x86" --argjson arm "$arm" '
            {
              include: (
                ($x86 | map({os: "ubuntu-latest", arch: "x86_64-linux", package: .})) +
                ($arm | map({os: "ubuntu-24.04-arm", arch: "aarch64-linux", package: .}))
              )
            }
          ')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
  build:
    needs: evaluate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.evaluate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ steps.app-token.outputs.token }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: notabug
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          pushFilter: '(-source$|\.tar\.gz$|\.tar\.xz$|\.patch$|\.drv$|-dev$|-deps-.*$)'
      - name: Build package
        run: nix build --accept-flake-config -L .#packages.${{ matrix.arch }}.${{ matrix.package }}
