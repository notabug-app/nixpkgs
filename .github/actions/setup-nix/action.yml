name: "Setup Nix Environment"
description: "Checkout, setup SSH, install Nix, and setup Firn Cache"
inputs:
  ssh-private-key:
    description: "SSH Private Key"
    required: true
  firn-url:
    description: "Firn URL"
    required: true
  firn-pkey:
    description: "Firn Public Key"
    required: true
  firn-secret:
    description: "Firn Secret"
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          netrc-file = /etc/nix/netrc
          accept-flake-config = true
          extra-substituters = ${{ inputs.firn-url }}
          extra-trusted-substituters = ${{ inputs.firn-url }}
          extra-trusted-public-keys = ${{ inputs.firn-pkey }}

    - name: Setup Crane Cachix
      uses: cachix/cachix-action@v15
      with:
        name: crane

    - name: Setup Firn Cache
      env:
        FIRN_SERVER_URL: ${{ inputs.firn-url }}
        FIRN_TOKEN: ${{ inputs.firn-secret }}
      run: nix develop -c setup-firn
      shell: bash
