name: "Setup Nix Environment"
description: "Checkout, setup SSH, install Nix"
inputs:
  ssh-private-key:
    description: "SSH Private Key"
    required: true
  firn-url:
    description: "Firn Cache URL"
    required: false
  firn-pkey:
    description: "Firn Cache Public Key"
    required: false
runs:
  using: "composite"
  steps:
    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          accept-flake-config = true
          ${{ inputs.firn-url != '' && format('extra-substituters = {0}', inputs.firn-url) || '' }}
          ${{ inputs.firn-url != '' && format('extra-trusted-substituters = {0}', inputs.firn-url) || '' }}
          ${{ inputs.firn-pkey != '' && format('extra-trusted-public-keys = {0}', inputs.firn-pkey) || '' }}

    - name: Setup Crane Cachix
      uses: cachix/cachix-action@v15
      with:
        name: crane
