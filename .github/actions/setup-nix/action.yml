name: "Setup Nix Environment"
description: "Checkout, setup SSH, install Nix"
inputs:
  ssh-private-key:
    description: "SSH Private Key"
    required: true
  extra-conf:
    description: "Extra Nix configuration lines"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          netrc-file = /etc/nix/netrc
          accept-flake-config = true
          ${{ inputs.extra-conf }}

    - name: Setup Crane Cachix
      uses: cachix/cachix-action@v15
      with:
        name: crane
